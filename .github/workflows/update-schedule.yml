name: Update Gubkin Schedule

on:
  schedule:
       - cron: '0 3 * * *'   # каждый день в 06:00 по Москве
  workflow_dispatch:       # кнопка ручного запуска

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright icalendar pytz
          playwright install --with-deps chromium

      - name: Run parser
        env:
          GUBKIN_LOGIN: ${{ secrets.GUBKIN_LOGIN }}
          GUBKIN_PASSWORD: ${{ secrets.GUBKIN_PASSWORD }}
          HEADLESS: "true"
        run: python gubkin_parser.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.ics
          git commit -m "Auto-update schedule" || echo "No changes to commit"
          git push
